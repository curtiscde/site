name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    # Image variants are committed so Netlify never has to encode them. This must run
    # before the build: its prebuild step would otherwise regenerate anything missing and
    # hide the problem. See docs/specs/committed-image-variants.md.
    - run: npm run images:check
    - run: npm run lint
    - run: npm run build
    # Fails if highlight.js or marked reappear in a client chunk. Both are
    # build-time-only; see docs/specs/post-asset-pipeline.md.
    - run: npm run check:bundle
    - run: npm run test:ci
